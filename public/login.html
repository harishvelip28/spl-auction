<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Login – Auction</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: radial-gradient(ellipse at top, #0c1a33 0%, #030710 60%);
      color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .card {
      width: 100%; max-width: 400px; background: #07101e; border: 1px solid #1a2d50;
      border-radius: 16px; padding: 36px 30px 30px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .logo {
      width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 12px; background: #f0c040;
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }
    h1 { text-align: center; font-size: 22px; font-weight: 800; color: #f0c040; letter-spacing: .3px; }
    .sub { text-align: center; font-size: 12px; color: #4a6080; letter-spacing: 1.5px; text-transform: uppercase; margin: 6px 0 28px; }
    label { display: block; font-size: 12px; font-weight: 700; color: #6a80aa; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; margin-bottom: 18px; font-size: 16px; color: #fff;
      background: #0a1528; border: 1px solid #1a2d50; border-radius: 8px; outline: none; transition: border-color .15s;
    }
    input:focus { border-color: #f0c040; }
    button {
      width: 100%; padding: 13px; margin-top: 4px; font-size: 16px; font-weight: 800; cursor: pointer;
      background: #f0c040; color: #050a14; border: none; border-radius: 8px; transition: opacity .15s, transform .1s;
    }
    button:hover:not(:disabled) { opacity: .88; }
    button:active:not(:disabled) { transform: scale(.98); }
    button:disabled { opacity: .5; cursor: wait; }
    .err {
      display: none; margin-bottom: 16px; padding: 10px 12px; font-size: 14px; border-radius: 8px;
      background: #1e0808; border: 1px solid #5a1010; color: #ff5f57;
    }
    .err.show { display: block; }
    .foot { text-align: center; font-size: 12px; color: #3d5070; margin-top: 22px; }
  </style>
</head>
<body>
  <form class="card" id="form" autocomplete="on">
    <div class="logo">🏏</div>
    <h1>Player Auction</h1>
    <div class="sub">Members only</div>

    <div class="err" id="err" role="alert"></div>

    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required autofocus />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />

    <button type="submit" id="btn">Login</button>
    <div class="foot">Ask the auction organiser for access.</div>
  </form>

  <script>
    const form = document.getElementById("form");
    const btn = document.getElementById("btn");
    const err = document.getElementById("err");

    // Only allow same-site relative redirects after login.
    function nextUrl() {
      const n = new URLSearchParams(location.search).get("next") || "/";
      return n.startsWith("/") && !n.startsWith("//") ? n : "/";
    }

    form.addEventListener("submit", async e => {
      e.preventDefault();
      err.classList.remove("show");
      btn.disabled = true; btn.textContent = "Logging in…";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ username: form.username.value, password: form.password.value }),
        });
        if (res.ok) { location.replace(nextUrl()); return; }
        const data = await res.json().catch(() => ({}));
        err.textContent = data.error || "Login failed. Please try again.";
      } catch {
        err.textContent = "Network error. Please check your connection.";
      }
      err.classList.add("show");
      form.password.value = ""; form.password.focus();
      btn.disabled = false; btn.textContent = "Login";
    });
  </script>
</body>
</html>
